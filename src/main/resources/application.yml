spring:
  application:
    name: project-recall

  # 로컬 시크릿 파일을 시작 시 불러온다(없으면 무시). 깃에 올리지 않는 GitHub OAuth 자격증명용.
  config:
    import: optional:file:./secret.properties

  # 내장 인메모리 H2 데이터베이스
  datasource:
    url: jdbc:h2:mem:recall;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # H2 웹 콘솔: http://localhost:8080/h2-console
  h2:
    console:
      enabled: true
      path: /h2-console

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: create-drop      # 앱 시작 시 스키마 생성, 종료 시 삭제
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
    open-in-view: false

  # GitHub OAuth2 소셜 로그인
  # 실제 값은 환경변수(GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET)로 주입한다.
  # 시크릿을 절대 이 파일에 직접 적지 말 것 (공개 저장소).
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID:changeme}
            client-secret: ${GITHUB_CLIENT_SECRET:changeme}
            scope: read:user
          kakao:
            client-id: ${KAKAO_CLIENT_ID:changeme}
            client-secret: ${KAKAO_CLIENT_SECRET:changeme}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
            client-name: Kakao
          naver:
            client-id: ${NAVER_CLIENT_ID:changeme}
            client-secret: ${NAVER_CLIENT_SECRET:changeme}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Naver
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
