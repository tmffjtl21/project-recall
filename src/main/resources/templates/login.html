<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recall 로그인</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/img/favicon.svg}">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
    <div class="card">
        <div class="login-brand">
            <img th:src="@{/img/favicon.svg}" alt="" width="30" height="30">
            <span>Recall</span>
        </div>
        <form th:action="@{/login}" method="post">
            <label for="username">아이디</label>
            <input type="text" id="username" name="username" autofocus required>

            <label for="password">비밀번호</label>
            <input type="password" id="password" name="password" required>

            <button type="submit" class="submit">로그인</button>
        </form>

        <div class="divider"><span>또는</span></div>
        <a class="social github" th:href="@{/oauth2/authorization/github}">GitHub 계정으로 로그인</a>
        <a class="social kakao" th:href="@{/oauth2/authorization/kakao}">카카오로 로그인</a>
        <a class="social naver" th:href="@{/oauth2/authorization/naver}">네이버로 로그인</a>

        <p class="msg error" th:if="${param.error}">아이디 또는 비밀번호가 올바르지 않습니다.</p>
        <p class="msg info" th:if="${param.logout}">로그아웃되었습니다.</p>

        <p class="hint">test / 123</p>
    </div>
</body>
</html>
